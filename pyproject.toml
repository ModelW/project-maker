[tool.poetry]
name = "modelw-project-maker"
version = "2026.10.1"
packages = [
    {  include = "model_w/project_maker", from = "src" }
]

description = "A tool to create Model-W-compliant projects"
authors = ["Rémy Sanchez <remy.sanchez@hyperthese.net>"]
license = "WTFPL"
homepage = "https://github.com/ModelW/project-maker"
repository = "https://github.com/ModelW/project-maker"
documentation = "https://github.com/ModelW/project-maker"
readme = "README.md"
keywords = ["model-w", "django", "nuxt", "boilerplate", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[tool.poetry.scripts]
project_maker = "model_w.project_maker.__main__:__main__"

[tool.poetry.dependencies]
python = "^3.14"
setuptools = "*"
rich = "^15.0.0"
Unidecode = "^1.4.0"
tomlkit = "^0.15.2"
node-edge = "^1.0.0"
ruff = ">=0.14"
pathspec = "^1.1.1"
textual = "^8.2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pyyaml = "^6.0.3"

[tool.ruff]
target-version = "py314"
# Black's standard, same as Prettier's printWidth
line-length = 88
extend-exclude = ["src/model_w/project_maker/template"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not slow"]
markers = [
    "slow: installs and lints every generated project (needs network, pnpm and poetry)",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
