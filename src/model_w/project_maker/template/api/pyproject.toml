[tool.poetry]
name = "~~~project_name__snake~~~"
version = "0.1.0"
description = ""
authors = ["___dev_id___"]
license = "Proprietary"

packages = [
    {include = "___project_name__snake___"},
]

[tool.poetry.dependencies]
python = "~3.14"
modelw-preset-django = {extras = [
    "psycopg",
    "health",
    "ninja",
    "procrastinate",
    # :: IF api__channels
    "channels",
    # :: ENDIF
    # :: IF api__wagtail
    "wagtail",
    # :: ENDIF
], version = ">=2026.10.1,<2026.11.0"}
drf-spectacular = {extras = ["sidecar"], version = "*"}
# Health check modules
markdown = "*"
networkx = "*"

[tool.poetry.group.dev.dependencies]
ipython = "*"
django-extensions = "*"
django-debug-toolbar = "*"
ruff = "*"
pytm = "^1.4.0"
openapi-generator-cli = {extras = ["jdk4py"], version = "^7.27.0"}

[tool.poetry.group.test.dependencies]
node-edge = "*"
psutil = "*"
pytest = "*"
pytest-bdd = "^9.0.1"
pytest-django = "*"
pytest-html = "*"
pytest-playwright = "*"
pyyaml = "*"
pixelmatch = "*"
pillow = "*"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "___project_name__snake___.django.settings"
python_files = ["test_*.py", "*_test.py"]
django_debug_mode = "keep"
log_cli = true
log_file = "bdd/report/results/test.log"
addopts = ["--output", "bdd/report/results/media", "--screenshot", "on", "--full-page-screenshot", "--video", "on", "--tracing", "retain-on-failure", "--cucumberjson=bdd/report/results/report.json", "--html=bdd/report/results/pytest.html"]

[tool.ruff]
target-version = "py314"
# Black's standard, same as Prettier's printWidth
line-length = 88

[tool.ruff.lint.per-file-ignores]
# pytest and pytest-bdd (through pluggy and inspect.signature) evaluate the
# annotations of tests, fixtures, steps and hooks at runtime, so the imports they
# use must stay outside of TYPE_CHECKING blocks (TC001-TC003).
"**/bdd/**" = ["ARG001", "S101", "TC001", "TC002", "TC003"]
"test_*.py" = ["ARG001", "S101", "TC001", "TC002", "TC003"]
"conftest.py" = ["TC001", "TC002", "TC003"]
# Django Ninja evaluates the annotations of the endpoints at runtime
"**/api.py" = ["TC001", "TC002", "TC003"]
# drf-spectacular evaluates the annotations of serializer methods at runtime
"**/serializers.py" = ["TC001", "TC002", "TC003"]
# Mutable class attributes (Meta options, panels, API fields...) are the way to
# declare Django and Wagtail models
"**/models.py" = ["RUF012"]
"**/snippets.py" = ["RUF012"]
# Standalone script mounted in the Locust container, not part of a package
"**/bdd/performance/locustfile.py" = ["INP001"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic (thus Django Ninja schemas) evaluates class annotations at runtime
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ninja.Schema",
    "ninja.ModelSchema",
]

[tool.ruff.lint.isort]
known-first-party = ["___project_name__snake___"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint]
select = [
    # -- Core --
    "E",  # pycodestyle (errors)
    "W",  # pycodestyle (warnings)
    "F",  # Pyflakes
    "I",  # isort
    "C90",  # McCabe Complexity
    "D1",  # Mandatory docstrings
    "S",  # Bandit

    # -- Bonus --
    "A",  # flake8-bugbear
    "B",  # flake8-bugbear
    "DTZ",  # date/time zone
    "T10",  # debugger
    "EM",  # error messages
    "EXE",  # executable
    "G",  # logging
    "UP",  # pyupgrade
    "ASYNC",  # async
    "INP",  # PEP 420
    "T20",  # no print
    "PT",  # pytest
    "SLOT",  # slots
    "TCH",  # type checking blocks
    "PTH",  # Use pathlib
    "FIX",  # Don't allow not done stuff in code
    "ERA",  # Don't comment code
    "RUF",  # Ruff stuff
    "TID251",  # Banned imports (See below)
]

exclude = [
    ".venv",
    "migrations",
    "*/migrations/*", 
]

[tool.ruff.format]
exclude = [
    ".venv",
    "migrations",
    "*/migrations/*", 
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `httpx` instead, which has timeouts by default."

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
