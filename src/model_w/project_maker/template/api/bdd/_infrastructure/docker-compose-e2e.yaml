---
# Run the e2e tests in Docker. All services share a dedicated compose network so they
# can reach each other by service name (e.g. postgres, redis, s3, api, front).
# The tests go through the router service, which mimics the production router and gives
# the front/API a single origin so cookies/SSO behave realistically.

services:

# :: IF api~~wagtail
  s3:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data -s3.port=9099
    env_file:
      - "../../../api/.env.test"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
# :: ENDIF

  postgres:
    image: postgres:15-alpine
    env_file:
      - "../../../api/.env.test"
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    build:
      context: "../../../api"
      dockerfile: Dockerfile.test
    depends_on:
      front:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
# :: IF api~~wagtail
      s3:
        condition: service_healthy
# :: ENDIF        
    environment:
      - SKIPBUILD=1
      - FRONTURL=http://router:80
      - DJANGO_LIVE_TEST_SERVER_ADDRESS=0.0.0.0:8000
    env_file:
      - "../../../api/.env.test"
    volumes:
      - ../report/:/code/bdd/report/
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:8000/back/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s   

  front:
    build:
      context: "../../../front"
    env_file:
      - "../../../front/.env.test"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://front:3000/favicon.png"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  router:
    image: nginx:alpine
    depends_on:
      front:
        condition: service_healthy
      api:   
        condition: service_healthy      
    volumes:
      - ./mock-digital-ocean-router.conf:/etc/nginx/nginx.conf