name: CI

on:
    pull_request:
    push:
        branches:
            - develop

jobs:
    # :: IF api__enable
    api-format:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install --no-root --only dev

            - name: Check format
              run: poetry run ruff format --check .

    api-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install --no-root --only dev

            - name: Run Ruff
              run: poetry run ruff check --output-format=github .
    # :: ENDIF

    # :: IF front__enable
    front-format:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: front
        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: front/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check format
              run: pnpm prettier --check .

    front-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: front
        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: front/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Sync SvelteKit
              run: pnpm svelte-kit sync

            - name: Run ESLint
              run: pnpm eslint . --format gha

    front-types:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: front
        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: front/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Svelte Check
              run: pnpm check

    front-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: front
        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: front/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: pnpm test --run
    # :: ENDIF
