name: CI

on:
    pull_request:
    push:
        branches:
            - develop

env:
    GIT_AUTHOR_NAME: CI
    GIT_AUTHOR_EMAIL: ci@example.com
    GIT_COMMITTER_NAME: CI
    GIT_COMMITTER_EMAIL: ci@example.com

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install

            - name: Check format
              run: poetry run ruff format --check .

            - name: Run Ruff
              run: poetry run ruff check --output-format=github .

    # The raw template only has to be formattable: the generated projects are
    # the ones that must pass every linter, which the test jobs check.
    template-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install

            - name: Check API format
              run: poetry run ruff format --check src/model_w/project_maker/template/api

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: src/model_w/project_maker/template/front/pnpm-lock.yaml

            - name: Check front format
              working-directory: src/model_w/project_maker/template/front
              run: |
                  pnpm install --frozen-lockfile
                  pnpm prettier --check .

    # Generation and static checks of every combination, on every OS
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install dependencies
              run: poetry install

            - name: Run tests
              run: poetry run pytest

    # Installs, lints, type-checks, tests and builds some generated projects,
    # then starts them like a developer would, on every OS
    test-slow:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - name: Install poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "poetry"

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            # The TypeScript client generation (openapi-generator)
            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"

            # The generated API's database and cache, natively on macOS and
            # Windows like on a developer's machine. On Linux, the action
            # doesn't support the latest Ubuntu yet, so it's a container.
            - name: Set up PostgreSQL
              if: runner.os != 'Linux'
              id: postgres
              uses: ikalnytskyi/action-setup-postgres@v8
              with:
                  postgres-version: "17"

            - name: Set up PostgreSQL (Linux)
              if: runner.os == 'Linux'
              run: >-
                  docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=postgres
                  --health-cmd pg_isready --health-interval 2s postgres:17 &&
                  until [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker ps -lq))" = healthy ]; do sleep 1; done

            - name: Set up Redis
              if: runner.os != 'Windows'
              uses: shogo82148/actions-setup-redis@v1
              with:
                  redis-version: "7"

            # No Redis for Windows: Memurai is the Redis-compatible server
            - name: Set up Redis (Windows)
              if: runner.os == 'Windows'
              run: choco install memurai-developer -y --no-progress

            - name: Install dependencies
              run: poetry install

            - name: Run slow tests
              run: poetry run pytest -m slow
              env:
                  PM_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri || 'postgresql://postgres:postgres@localhost:5432/postgres' }}
